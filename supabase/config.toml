project_id = "seekerai"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = true
minimum_password_length = 8

[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(TURNSTILE_SECRET_KEY)"

[auth.email]
enable_signup = true
enable_confirmations = true

# Webhooks de provedores: sem JWT — autenticação é a assinatura do provedor.
[functions.stripe-webhook]
verify_jwt = false

[functions.mercosulpay-webhook]
verify_jwt = false

# Chamadas do app: exigem JWT do usuário autenticado.
[functions.billing-checkout]
verify_jwt = true

[functions.places-search]
verify_jwt = true

[functions.ai-generate]
verify_jwt = true

[functions.whatsapp-check]
verify_jwt = true

# Só chamada interna do app (service role conferida no código).
[functions.welcome-message]
verify_jwt = false

# Chamada interna do app (x-internal-key), sem JWT de usuário.
[functions.support-agent]
verify_jwt = false
